<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <table id="table1">
    <tr>
      <th rowspan="2">id</th>
      <th rowspan="2">className</th>
      <th rowspan="2">flex-grow</th>
      <th rowspan="2">flex-shrink</th>
      <th colspan="2">width</th>
      <th rowspan="2">difference</th>
    </tr>
    <tr>
      <th id="th1">before</th>
      <th id="th2">after</th>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
  <div id="div0" class="container">
    <div id="div1" class="flex-item">One</div>
    <div id="div2" class="flex-item">Two</div>
    <div id="div3" class="flex-item">Three</div>
  </div>
  <script>
    document.getElementById('th1').addEventListener('click', function () {
      injectFlexLayoutData(document.getElementById('div0'), document.getElementById('table1'), 'before');
    });
    document.getElementById('th2').addEventListener('click', function () {
      injectFlexLayoutData(document.getElementById('div0'), document.getElementById('table1'), 'after');
    });
    function getAvailableSpace(container) {
      const domRect = container.getBoundingClientRect();
      const styles = window.getComputedStyle(container);
      if (styles.flexWrap === 'wrap') return null;
      const containerContentWidth =  domRect.width -
        parseFloat(styles.borderLeftWidth) -
        parseFloat(styles.borderRightWidth) -
        parseFloat(styles.paddingLeft) -
        parseFloat(styles.paddingRight)
      const flexItems = container.children;
      if (flexItems.length === 0) return containerContentWidth;
      let sumItemFlexSpace = 0.0;
      for (let i = 0; i < flexItems.length; i++) {
        const styles = window.getComputedStyle(flexItems[i]);
        sumItemFlexSpace += flexItems[i].getBoundingClientRect().width +
          parseFloat(styles.marginLeft) +
          parseFloat(styles.marginRight);
      }
      return containerContentWidth -
          sumItemFlexSpace -
          (styles.gap === 'normal'? 0 : (flexItems.length - 1) * parseFloat(styles.gap));
    }
    function snapshotElementData(element) {
      return [element.id,
        element.className,
        window.getComputedStyle(element).flexGrow,
        window.getComputedStyle(element).flexShrink,
        element.getBoundingClientRect().width];
    }
    function injectFlexLayoutData(container, table, when){
      if (when === 'before') {
        let elementData = snapshotElementData(container);
        for (let i = 0; i < elementData.length; i++) {
          table.rows[2].cells[i].innerHTML = elementData[i];
        }
        table.rows[2].cells[5].innerHTML = '';
        table.rows[2].cells[6].innerHTML = '';
        let children = container.children;
        for (let c = 0; c < children.length; c++) {
          elementData = snapshotElementData(children[c]);
          for (let i = 0; i < elementData.length; i++) {
            table.rows[3 + c].cells[i].innerHTML = elementData[i];
            table.rows[3 + c].cells[5].innerHTML = '';
            table.rows[3 + c].cells[6].innerHTML = '';
          }
        }
      } else if (when === 'after') {
          let width = container.getBoundingClientRect().width;
          table.rows[2].cells[5].innerHTML = width;
          table.rows[2].cells[6].innerHTML = width - parseFloat(table.rows[2].cells[4].innerHTML);
          let children = container.children;
          for (let c = 0; c < children.length; c++) {
            width = children[c].getBoundingClientRect().width;
            table.rows[3 + c].cells[5].innerHTML = width;
            table.rows[3 + c].cells[6].innerHTML = width - parseFloat(table.rows[3 + c].cells[4].innerHTML);
          }
      }
    }
    
  </script>
</body>
</html>

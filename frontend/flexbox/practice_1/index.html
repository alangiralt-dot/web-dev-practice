<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Navbar Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <!-- 1. The Logo -->
        <div class="logo">FlexFit</div>

        <!-- 2. The Search Bar (Should grow to fill space) -->
        <div class="search-container">
            <input type="text" placeholder="Search the web...">
        </div>

        <!-- 3. The Links (Should stay together on the right) -->
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Features</a></li>
            <li><a href="#">Pricing</a></li>
        </ul>
    </nav>

</body>
</html>
